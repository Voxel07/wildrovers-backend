# OIDC Configuration for Authentik (REST API Service)
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${AUTHENTIK_AUTH_SERVER_URL:http://localhost:9000/application/o/wildrovers/}
quarkus.oidc.client-id=${AUTHENTIK_CLIENT_ID:wildrovers-backend}
quarkus.oidc.credentials.secret=${AUTHENTIK_CLIENT_SECRET:dev-only-secret}
%prod.quarkus.oidc.credentials.secret=${AUTHENTIK_CLIENT_SECRET}
quarkus.oidc.roles.role-claim-path=roles
quarkus.oidc.token.principal-claim=${AUTHENTIK_PRINCIPAL_CLAIM:preferred_username}
# Exact (case-insensitive) group names that grant application roles; no substring matching.
app.oidc.groups.admin=${APP_OIDC_GROUPS_ADMIN:Admin}
app.oidc.groups.vorstand=${APP_OIDC_GROUPS_VORSTAND:Vorstand}
app.oidc.groups.mitglied=${APP_OIDC_GROUPS_MITGLIED:Mitglied}
app.oidc.groups.frischling=${APP_OIDC_GROUPS_FRISCHLING:Frischling}
# Bearer tokens must be issued for this client; tokens of other Authentik apps are rejected.
quarkus.oidc.token.audience=${APP_OIDC_AUDIENCE:${app.oidc.client-id}}
# Browser login (backend for frontend): the frontend sends the authorization code and PKCE
# verifier, the backend exchanges them. Must be the client id the frontend uses
# (VITE_OIDC_CLIENT_ID) and the exact redirect URI registered in Authentik (VITE_OIDC_REDIRECT_URI).
app.oidc.client-id=${AUTHENTIK_FRONTEND_CLIENT_ID:${AUTHENTIK_CLIENT_ID:wildrovers-backend}}
app.oidc.client-secret=${AUTHENTIK_FRONTEND_CLIENT_SECRET:}
app.oidc.redirect-uri=${OIDC_REDIRECT_URI:${app.frontend-url}/Login}
# Claim with the Authentik groups; "groups" is used when this claim is missing.
app.oidc.role-claim=${quarkus.oidc.roles.role-claim-path:roles}
# Session cookies (HttpOnly). wr_at: access JWT, path /, short-lived.
# wr_rt: opaque refresh token, path /auth only, rotated on every use.
app.auth.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:15m}
# Idle lifetime of a session; every refresh extends it, up to the absolute maximum.
app.auth.refresh-token-ttl=${AUTH_REFRESH_TOKEN_TTL:7d}
app.auth.session-max-age=${AUTH_SESSION_MAX_AGE:30d}
# Strict works when frontend and API share a registrable domain (wild-rovers.de / api.wild-rovers.de).
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
app.auth.cookie.secure=true
%dev.app.auth.cookie.secure=false
%test.app.auth.cookie.secure=false
# Encrypts the Authentik refresh tokens stored with each session (long random value).
app.auth.session-encryption-key=${AUTH_SESSION_ENCRYPTION_KEY:change-this-development-key}
%prod.app.auth.session-encryption-key=${AUTH_SESSION_ENCRYPTION_KEY}
#JWT
## Private Key used to sign JWTs for username/password login
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH:privateKey.pem}
local.jwt.public-key.location=${JWT_PUBLIC_KEY_PATH:publicKey.pem}
# This committed key pair is only for `quarkus:dev`. Production continues to
# require the externally mounted key paths below.
%dev.smallrye.jwt.sign.key.location=devPrivateKey.pem
%dev.local.jwt.public-key.location=devPublicKey.pem
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_PATH}
%prod.local.jwt.public-key.location=${JWT_PUBLIC_KEY_PATH}
# Local JWT verification is handled by LocalJwtAuthMechanism (no mp.jwt.verify.* needed)
#Email
# quarkus.mailer.from=Camo@wildrovers.io
# quarkus.mailer.host=smtp.sendgrid.net
# quarkus.mailer.port=465
# quarkus.mailer.tls=true
# quarkus.mailer.username=${EMAIL_SEDNGRID_USERNAME}
# quarkus.mailer.password=${EMAIL_SEDNGRID_PASSWORD}
# quarkus.mailer.mock=false
quarkus.mailer.auth-methods=${MAILER_AUTH_METHODS}
quarkus.mailer.from=${MAILER_FROM}
quarkus.mailer.host=${MAILER_HOST}
quarkus.mailer.port=${MAILER_PORT}
quarkus.mailer.tls=${MAILER_TLS:${MAILER_SSL:false}}
quarkus.mailer.start-tls=${MAILER_START_TLS}
quarkus.mailer.username=${MAILER_USERNAME}
quarkus.mailer.password=${MAILER_PASSWORD}
quarkus.mailer.mock=${MAILER_MOCK:false}
#File Upload
quarkus.http.body.handle-file-uploads=true
quarkus.http.limits.max-form-attribute-size=10M
quarkus.http.limits.max-body-size=20M
quarkus.http.body.delete-uploaded-files-on-end=true
# quarkus.http.body.uploads-directory = "/home"
quarkus.application.name=wildrovers
quarkus.application.version=1.0.0-SNAPSHOT
# Forum image storage — files saved here are served via /forum/img endpoint.
# In production: set to a directory OUTSIDE the web root, with no execute permissions.
forum.images.upload-dir=${FORUM_IMAGES_UPLOAD_DIR:${user.home}/wildrovers-uploads/forum}
# HMAC key for signed forum image URLs. Outside prod a random per-process key is used when empty;
# prod refuses to start without a stable key (otherwise every restart breaks the signed URLs).
forum.images.require-signing-key=false
%prod.forum.images.require-signing-key=true
forum.images.signing-key=${FORUM_IMAGE_SIGNING_KEY:}
# Nightly sweep that deletes forum image files no post/answer references (deleted posts, edits, abandoned uploads).
forum.images.cleanup-cron=${FORUM_IMAGES_CLEANUP_CRON:0 30 3 * * ?}
# Both full-size files and thumbnails count. Daily usage is retained on disk, per user, in UTC.
forum.images.max-storage-bytes=${FORUM_IMAGES_MAX_STORAGE_BYTES:2147483648}
forum.images.max-user-daily-bytes=${FORUM_IMAGES_MAX_USER_DAILY_BYTES:52428800}
# User photos storage — files saved here are served via /user/photo endpoint.
user.photos.upload-dir=${USER_PHOTOS_UPLOAD_DIR:${user.home}/wildrovers-uploads/user-photos}
user.backgrounds.upload-dir=${USER_BACKGROUNDS_UPLOAD_DIR:${user.home}/wildrovers-uploads/profile-backgrounds}
# Immich "drop" upload link, only handed out to team members via GET /gallery/upload-url
gallery.immich.drop-url=${IMMICH_DROP_URL:}
# Optional exact hostname for album URLs (HTTPS is always required).
gallery.immich.allowed-host=${IMMICH_ALLOWED_HOST:}
google.calendar.credentials=${GOOGLE_CALENDAR_CREDENTIALS:}
google.calendar.id=${GOOGLE_CALENDAR_ID:primary}
# Health and Prometheus metrics live on the management interface (port 9100, not 9000:
# that is Authentik's default), which docker-compose does not expose.
quarkus.management.enabled=true
quarkus.management.port=${MANAGEMENT_PORT:9100}
# API description: written to target/openapi at build time for generating typed clients.
# The live /q/openapi endpoint and Swagger UI are only served outside production.
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.info-title=Wild Rovers API
%prod.quarkus.smallrye-openapi.enable=false
# Enable OpenTelemetry Traces & Metrics
# Set OTEL_DISABLED=true in .env during local dev to silence connection errors
quarkus.otel.sdk.disabled=${OTEL_DISABLED:true}
quarkus.otel.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.service.name=wildrovers-backend
# Set up the protocol & OpenObserve OTLP endpoint
# Use a single base endpoint — Quarkus auto-appends /v1/traces, /v1/metrics, /v1/logs
quarkus.otel.exporter.otlp.protocol=http/protobuf
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
quarkus.otel.exporter.otlp.metrics.protocol=http/protobuf
quarkus.otel.exporter.otlp.endpoint=${OPENOBSERVE_ENDPOINT:http://localhost:5080/api/default}
# Authentication header (Basic auth base64 of email:password)
quarkus.otel.exporter.otlp.headers=Authorization=Basic ${OPENOBSERVE_TOKEN:}
# Debug logging for OTel exporter — remove once traces are confirmed working
quarkus.log.category."io.quarkus.opentelemetry".level=${OTEL_LOG_LEVEL:WARN}
quarkus.log.category."io.opentelemetry".level=${OTEL_LOG_LEVEL:WARN}
# Ensure traceparent/tracestate context is permitted for distributed trace propagation
# Application Base URL (used for generating verification/reset links)
app.base-url=${APP_BASE_URL:http://localhost:8080}
# Password-reset links stay valid this long (single use, stored hashed).
app.password-reset.ttl=${PASSWORD_RESET_TTL:30m}
# Local MaxMind GeoLite2/GeoIP2 Country database (.mmdb). Empty: no country tracking.
app.geoip.database=${GEOIP_DATABASE_PATH:}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
# Caching Configuration
quarkus.cache.caffeine."team-members".expire-after-write=5m
# Event Caches
quarkus.cache.caffeine."events".expire-after-write=10m
quarkus.cache.caffeine."upcoming-events".expire-after-write=10m
quarkus.cache.caffeine."events-by-id".expire-after-write=10m
quarkus.cache.caffeine."events-by-post-id".expire-after-write=10m
quarkus.cache.caffeine."events-in-range".expire-after-write=10m
quarkus.cache.caffeine."event-years".expire-after-write=10m
# Forum topic that receives the discussion post of every new event
app.events.forum-topic-id=${EVENTS_FORUM_TOPIC_ID:1}
# Retry interval for Google Calendar entries that could not be synced right after a change
events.calendar.retry-interval=${EVENTS_CALENDAR_RETRY_INTERVAL:5m}
# Gallery Caches
quarkus.cache.caffeine."galleries".expire-after-write=10m
quarkus.cache.caffeine."galleries-by-id".expire-after-write=10m
# Forum Category Caches
quarkus.cache.caffeine."forum-categories".expire-after-write=10m
quarkus.cache.caffeine."forum-categories-by-name".expire-after-write=10m
quarkus.cache.caffeine."forum-categories-by-id".expire-after-write=10m
quarkus.cache.caffeine."forum-category-count".expire-after-write=10m
# Forum Poll Caches
quarkus.cache.caffeine."poll-has-voted".expire-after-write=10m
quarkus.cache.caffeine."poll-voted-options".expire-after-write=10m
# Rate Limiter
rate-limiter.enabled=${RATE_LIMITER_ENABLED:true}
%test.rate-limiter.enabled=false
# Notification delivery. Zoho Mail Lite has a dynamic floor of 50 external
# messages per rolling hour; keep ten messages of headroom for mailbox activity.
notification.mail.max-per-hour=${NOTIFICATION_MAIL_MAX_PER_HOUR:40}
notification.mail.max-per-recipient-day=${NOTIFICATION_MAIL_MAX_PER_RECIPIENT_DAY:12}
notification.mail.delivery-interval=${NOTIFICATION_MAIL_DELIVERY_INTERVAL:90s}
notification.digest.cron=${NOTIFICATION_DIGEST_CRON:0 0 6 * * ?}
notification.reminder.cron=${NOTIFICATION_REMINDER_CRON:0 5 6 * * ?}
notification.time-zone=${NOTIFICATION_TIME_ZONE:Europe/Berlin}
notification.webhook.delivery-interval=${NOTIFICATION_WEBHOOK_DELIVERY_INTERVAL:5s}
notification.webhook.require-https=${NOTIFICATION_WEBHOOK_REQUIRE_HTTPS:true}
notification.webhook.timeout-seconds=${NOTIFICATION_WEBHOOK_TIMEOUT_SECONDS:8}
notification.webhook.encryption-key=${NOTIFICATION_WEBHOOK_ENCRYPTION_KEY:change-this-development-key}
%prod.notification.webhook.encryption-key=${NOTIFICATION_WEBHOOK_ENCRYPTION_KEY}
%test.notification.webhook.require-https=false

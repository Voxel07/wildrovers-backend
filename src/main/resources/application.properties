# Configuration file
#DB Settings
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${SQL_USER}
quarkus.datasource.password=${SQL_PASSWORD:${SQL_PASSOWRD}}
quarkus.datasource.jdbc.url=${SQL_URL}
#show sql statements
#quarkus.hibernate-orm.log.sql = true
# quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.schema-management.strategy=update
%prod.quarkus.hibernate-orm.schema-management.strategy=validate
#Allow live realoding without restarting Quarkus
quarkus.live-reload.instrumentation=true
#Frontendgedöns
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.headers=accept, origin, authorization, content-type, x-requested-with, traceparent, tracestate
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS
quarkus.http.cors.exposed-headers=X-Account-Status,X-Total-Count
# The browser session lives in HttpOnly cookies, which cross-origin requests only send with credentials.
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.proxy.proxy-address-forwarding=true
%prod.quarkus.http.proxy.trusted-proxies=${TRUSTED_PROXIES}
#Logging
quarkus.log.file.enabled=true
quarkus.log.file.path=${LOG_FILE_PATH:/tmp/wildrovers/trace.log}
%test.quarkus.log.file.enabled=false
quarkus.log.file.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
# Security
## Cookies
# quarkus.http.same-site-cookie.key.enable-client-checker=false
# quarkus.http.same-site-cookie.key.add-secure-for-none=false
# quarkus.http.same-site-cookie.key.case-sensitive=false
# quarkus.http.same-site-cookie.key.value=strict
# quarkus.http.same-site-cookie.jwt.value=strict
# quarkus.http.same-site-cookie.session.value=strict
## HTTPS / SSL
# quarkus.http.host=0.0.0.0
# quarkus.ssl.native=true
quarkus.http.port=8080
# quarkus.http.ssl-port=443
# quarkus.http.ssl.certificate.file=${SSH_PATH_CERT}
# quarkus.http.ssl.certificate.key-file=${SSH_PATH_KEY}
# quarkus.http.ssl.certificate.key-store-file=/path/to/keystore

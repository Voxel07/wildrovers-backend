# ── Test profile configuration ──────────────────────────────────────────
# H2 in-memory — no MODE=MariaDB to avoid DDL incompatibilities.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
quarkus.datasource.username=sa
quarkus.datasource.password=

# Schema: drop-and-create each run
quarkus.hibernate-orm.database.generation=drop-and-create

# Keep the mock mailer independent of deployment SMTP environment variables.
quarkus.mailer.mock=true
quarkus.mailer.from=no-reply@example.test
quarkus.mailer.host=localhost
quarkus.mailer.port=1025
quarkus.mailer.tls=false
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.auth-methods=PLAIN
quarkus.mailer.username=test
quarkus.mailer.password=test

# Disable features not needed for tests
quarkus.otel.sdk.disabled=true
quarkus.live-reload.instrumentation=false
quarkus.oidc.enabled=false
notification.mail.delivery-interval=1h
notification.webhook.delivery-interval=1h

# Never write to the real Google Calendar during tests. A non-empty, invalid
# value makes GoogleCalendarService.getCredentials() return null and skip the sync.
google.calendar.credentials=test-disabled
google.calendar.id=primary

# File uploads to temp
forum.images.upload-dir=${java.io.tmpdir}/wildrovers-test/forum
user.photos.upload-dir=${java.io.tmpdir}/wildrovers-test/user-photos
user.backgrounds.upload-dir=${java.io.tmpdir}/wildrovers-test/profile-backgrounds

# Exercise the same development-only key pair used by `quarkus:dev`.
smallrye.jwt.sign.key.location=devPrivateKey.pem
local.jwt.public-key.location=devPublicKey.pem

name: Build JVM and Native Images and Publish to GHCR

on:
  push:
    tags:
      - '*'

jobs:
  build-and-push:
    name: Build ${{ matrix.variant }} Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: jvm
            dockerfile: src/main/docker/Dockerfile.jvm
            tag_suffix: ''
            latest_tag: latest
          - variant: native
            dockerfile: src/main/docker/Dockerfile.native-multistage
            tag_suffix: '-native'
            latest_tag: native
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Tag is on master Branch
        id: check-branch
        run: |
          git fetch origin master --depth=1 || git fetch origin master
          # Check if the commit pointed to by the tag is on origin/master
          if git branch -r --contains ${{ github.sha }} | grep -q 'origin/master'; then
            echo "on_master=true" >> $GITHUB_OUTPUT
            echo "Tag is on the master branch. Proceeding with build."
          else
            echo "on_master=false" >> $GITHUB_OUTPUT
            echo "Tag is NOT on the master branch. Skipping build."
          fi

      - name: Lowercase Repository Details
        if: steps.check-branch.outputs.on_master == 'true'
        id: repo_details
        run: |
          echo "owner=${OWNER,,}" >> $GITHUB_OUTPUT
          echo "repo=${REPO,,}" >> $GITHUB_OUTPUT
        env:
          OWNER: '${{ github.repository_owner }}'
          REPO: '${{ github.event.repository.name }}'

      - name: Extract Tag Name
        if: steps.check-branch.outputs.on_master == 'true'
        id: get_tag
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Java JDK
        if: steps.check-branch.outputs.on_master == 'true' && matrix.variant == 'jvm'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        if: steps.check-branch.outputs.on_master == 'true' && matrix.variant == 'jvm'
        run: chmod +x mvnw

      - name: Build JVM Application with Maven
        if: steps.check-branch.outputs.on_master == 'true' && matrix.variant == 'jvm'
        run: |
          ./mvnw package -DskipTests

      - name: Log in to GHCR
        if: steps.check-branch.outputs.on_master == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check-branch.outputs.on_master == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        if: steps.check-branch.outputs.on_master == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo_details.outputs.owner }}/${{ steps.repo_details.outputs.repo }}:${{ steps.get_tag.outputs.tag }}${{ matrix.tag_suffix }}
            ghcr.io/${{ steps.repo_details.outputs.owner }}/${{ steps.repo_details.outputs.repo }}:${{ matrix.latest_tag }}
          cache-from: type=gha,scope=backend-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.variant }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
